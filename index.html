<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>October 3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee7dc;color:#302a25;font-family:Georgia,"Times New Roman",serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(680px,100%);background:linear-gradient(145deg,#fbf6ed,#f3eadb);
border:1px solid #c8a873;border-radius:24px;padding:42px 28px;position:relative;
box-shadow:0 18px 60px rgba(65,45,25,.12);overflow:hidden;text-align:center}
.card:before{content:"";position:absolute;inset:10px;border:1px solid rgba(152,114,61,.22);border-radius:18px;pointer-events:none}
.flower{position:absolute;font-size:58px;opacity:.42}.tl{top:15px;left:18px}.br{right:18px;bottom:12px}
.gold{color:#98723d}.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:18px}
h1{font-size:clamp(38px,9vw,64px);font-weight:400;margin:0 0 14px}
h2{font-size:28px;font-weight:400;margin:0 0 18px}
p{font-size:17px;line-height:1.8;margin:12px auto;max-width:560px}
button{font:inherit;border:1px solid #b99a68;background:#fffaf2;color:#4a3a2a;border-radius:999px;
padding:12px 24px;cursor:pointer;margin-top:18px}
button:hover{background:#f8eedc}
input{font:inherit;font-size:20px;text-align:center;width:180px;padding:12px;border:1px solid #b99a68;
border-radius:12px;background:#fffaf2;color:#302a25}
.script{font-family:"Brush Script MT","Segoe Script",cursive}
.big{font-size:54px}
.small{font-size:13px;letter-spacing:.12em}
.hidden{display:none}
.fade{animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="wrap"><main class="card" id="app">
<div class="flower tl">🌸</div><div class="flower br">🌸</div>
<section id="stage" class="fade">
<div class="eyebrow gold">A little something for you</div>
<h1>Before you open this...</h1>
<p>There are three little clues.<br>Put them together, and you'll find the date I chose.</p>
<button id="start">Begin</button>
</section>
</main></div>

<script>
const stage=document.getElementById("stage");
function show(html){stage.className="fade";stage.innerHTML=html}

document.getElementById("start").addEventListener("click",()=>{
show(`
<div class="eyebrow gold">Clue I</div>
<h2>The month</h2>
<p>Think of the day I chose.<br>It falls in the <b>8th month</b> of the lunar calendar.</p>
<button data-next="1">I have it</button>`);
});

stage.addEventListener("click",e=>{
if(e.target.dataset.next==="1"){
show(`
<div class="eyebrow gold">Clue II</div>
<h2>The day</h2>
<p>The lunar date is the <b>23rd</b>.<br>Put the two clues together.</p>
<button data-next="2">8 · 23</button>`);
}
else if(e.target.dataset.next==="2"){
show(`
<div class="eyebrow gold">One last thing</div>
<h2>What date did I choose?</h2>
<p>Enter the date in <b>DD / MM</b>.</p>
<input id="answer" inputmode="numeric" maxlength="5" placeholder="03 / 10" aria-label="Date">
<br><button id="unlock">Unlock</button>
<p id="hint" class="small"></p>`);
}
else if(e.target.id==="unlock"){
const answer=(document.getElementById("answer").value||"").replace(/\D/g,"");
if(answer==="0310") reveal();
else document.getElementById("hint").textContent="Not quite... think about the date I wanted us to remember.";
}
});

function reveal(){
show(`
<div class="eyebrow gold">3 October 2026 · 农历八月廿三</div>
<h1 class="script gold">The Meaning of October 3</h1>

<p>I chose October 3 for a reason.</p>

<p>In the lunar calendar, it falls on <b>八月廿三</b>, a day traditionally associated with forming a commitment and leaving uncertainty behind to begin something with intention.</p>

<p>But I don’t believe a date can decide our fate.</p>

<p>What matters to me is everything that happens before it. The time we spend getting to know each other, growing closer, and slowly finding our way toward one another.</p>

<p>That’s why I wanted our beginning to have meaning too.</p>

<p>Not because the date is simply lucky, but because I wanted a day we could always remember.</p>

<p>A day when something that had been quietly growing between us finally became something we could call our own.</p>

<p>And if you ever ask me why I chose October 3, I hope my answer will always be the same:</p>

<p><i>Because that was the day I wanted to stop wondering, “What if?”</i></p>

<div class="script gold big">I choose you.</div>
<div class="gold" style="font-size:24px;margin-top:14px">♡</div>
`);
}
</script>
</body>
</html>
